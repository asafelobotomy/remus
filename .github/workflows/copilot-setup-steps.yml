name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-copilot-surfaces:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify core companion files
        run: |
          test -f .github/copilot-instructions.md
          test -f .github/copilot-version.md
          test -f .copilot/workspace/workspace-index.json
