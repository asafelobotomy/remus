name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.10.1). Leave empty to read APP_VERSION from api.h'
        required: false
        type: string
      force:
        description: 'Rebuild and republish even if the tag already exists'
        required: false
        type: boolean
        default: false

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Get version from api.h
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="v$(bash .github/scripts/read-app-version.sh)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if release needed
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            if [[ "$FORCE" == "true" ]]; then
              echo "Tag $VERSION exists — force rebuild enabled"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $VERSION already exists — use force=true to republish"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: bash .github/scripts/install-build-deps.sh

      - name: Capture dependency versions
        run: |
          mkdir -p build dist
          dpkg-query -W -f='${Package}==${Version}\n' \
            build-essential cmake qt6-base-dev qt6-base-private-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-private-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev libxkbcommon-dev zlib1g-dev libarchive-dev qtkeychain-qt6-dev \
            zip unzip p7zip-full \
            > dist/dependency-manifest.txt
          echo "--- cmake version ---" >> dist/dependency-manifest.txt
          cmake --version >> dist/dependency-manifest.txt
          echo "--- compiler version ---" >> dist/dependency-manifest.txt
          c++ --version >> dist/dependency-manifest.txt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREMUS_ENABLE_WARNINGS=ON

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package CLI archive
        run: |
          chmod +x scripts/package_cli_archive.sh
          scripts/package_cli_archive.sh

      - name: Download linuxdeploy
        run: |
          LINUXDEPLOY_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          LINUXDEPLOY_SHA256="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
          wget -q "$LINUXDEPLOY_URL" -O build/linuxdeploy-x86_64.AppImage
          echo "$LINUXDEPLOY_SHA256  build/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x build/linuxdeploy-x86_64.AppImage

      - name: Download linuxdeploy-plugin-qt
        run: |
          PLUGIN_URL="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          wget -q "$PLUGIN_URL" -O build/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x build/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        env:
          LINUXDEPLOY: build/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_PLUGIN_QT: build/linuxdeploy-plugin-qt-x86_64.AppImage
        run: |
          chmod +x scripts/package_appimage.sh
          scripts/package_appimage.sh

      - name: Verify release checksums
        run: |
          shopt -s nullglob
          checksums=(dist/*.sha256 dist/*.AppImage.sha256)
          if [ "${#checksums[@]}" -eq 0 ]; then
            echo "No checksum files found in dist/" >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            echo "Checking $checksum"
            sha256sum -c "$checksum"
          done

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.AppImage

      - name: Create Git Tag
        if: github.event.inputs.force != 'true'
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping tag creation"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Remus ${{ needs.prepare-release.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare-release.outputs.version, 'alpha') || contains(needs.prepare-release.outputs.version, 'beta') || contains(needs.prepare-release.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/dependency-manifest.txt
