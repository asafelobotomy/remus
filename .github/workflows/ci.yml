name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: bash .github/scripts/install-build-deps.sh

      - name: Capture dependency versions
        run: |
          mkdir -p build
          dpkg-query -W -f='${Package}==${Version}\n' \
            build-essential cmake qt6-base-dev qt6-base-private-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-private-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev libxkbcommon-dev zlib1g-dev libarchive-dev qtkeychain-qt6-dev \
            zip unzip p7zip-full shellcheck mame-tools \
            > build/dependency-manifest.txt
          echo "--- cmake version ---" >> build/dependency-manifest.txt
          cmake --version >> build/dependency-manifest.txt
          echo "--- compiler version ---" >> build/dependency-manifest.txt
          c++ --version >> build/dependency-manifest.txt
          cat build/dependency-manifest.txt

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DREMUS_ENABLE_WARNINGS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload dependency manifest
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-manifest-linux-x64
          path: build/dependency-manifest.txt

      - name: Upload CLI artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remus-cli-linux-x64
          path: build/remus-cli

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: |
          bash .github/scripts/install-build-deps.sh
          sudo apt-get install -y lcov

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DREMUS_ENABLE_WARNINGS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file build/coverage.info --rc lcov_branch_coverage=0
          lcov --remove build/coverage.info '/usr/*' '*/tests/*' --output-file build/coverage.info
          genhtml build/coverage.info --output-directory build/coverage-html

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: "54"
        run: bash .github/scripts/check-coverage-threshold.sh build/coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            build/coverage.info
            build/coverage-html

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check formatting (clang-format)
        run: |
          bash .github/scripts/install-clang-format.sh
          mapfile -t files < <(find src tests -type f \( -name '*.cpp' -o -name '*.h' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found to check."
            exit 1
          fi
          bash .github/scripts/clang-format-bin.sh --dry-run --Werror "${files[@]}"

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: bash .github/scripts/install-build-deps.sh

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DREMUS_ENABLE_WARNINGS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: bash .github/scripts/run-shellcheck.sh

  qml-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: bash .github/scripts/install-build-deps.sh

      - name: Lint QML sources
        run: bash .github/scripts/run-qmllint.sh

  clang-tidy:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: |
          bash .github/scripts/install-build-deps.sh
          sudo apt-get install -y clang-tidy

      - name: Spot-check core sources
        run: bash .github/scripts/run-clang-tidy.sh

  compendium-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Validate bootstrap compendium schema
        run: |
          bash scripts/setup_compendium_db.sh
          bash .github/scripts/validate-compendium-db.sh data/compendium/remus_compendium.db \
            data/compendium/validation/0000_bootstrap_checks.sql
          bash .github/scripts/validate-compendium-db.sh data/compendium/remus_compendium.db \
            data/compendium/validation/0004_disc_set_checks.sql

  compendium-fixture-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: bash .github/scripts/install-build-deps.sh

      - name: Build remus-cli
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREMUS_ENABLE_WARNINGS=ON
          cmake --build build -j$(nproc) --target remus-cli

      - name: Fixture compendium ingest + disc-set validation
        run: bash scripts/ci_compendium_fixture_build.sh
